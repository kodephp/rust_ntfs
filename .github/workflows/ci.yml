name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  # ------------------------------------------------------------------
  # Lint + test on macOS (the primary target).
  # ------------------------------------------------------------------
  lint-macos:
    name: Lint (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all -- -D warnings

      - name: Test
        run: cargo test --workspace

  # ------------------------------------------------------------------
  # Build release binaries + macOS .pkg installer.
  # ------------------------------------------------------------------
  build-macos:
    name: Build macOS installer
    runs-on: macos-14
    needs: lint-macos
    # `Attach to release` updates the release with the built .pkg, which
    # needs write access. Without this the step fails with
    # "Resource not accessible by integration".
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Required by scripts/build-macos.sh step [1/5]. Without the Tauri
      # CLI the GUI bundle cannot be produced and the job fails with
      # `error: no such command: tauri`.
      - name: Install Tauri CLI
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: |
          chmod +x scripts/build-macos.sh scripts/install.sh scripts/gen-third-party-licenses.sh scripts/pkg-scripts/*.sh
          ./scripts/build-macos.sh

      - name: Verify pkg
        run: |
          ls -lh dist/ntfs-mac-*.pkg
          pkgutil --payload-files dist/ntfs-mac-*.pkg
          pkgutil --check-signature dist/ntfs-mac-*.pkg || true

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ntfs-mac-macos
          path: dist/ntfs-mac-*.pkg
          retention-days: 30

      # Attach to GitHub Release if this is a release build.
      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ntfs-mac-*.pkg

  # ------------------------------------------------------------------
  # Security audit (advisory database, cross-platform).
  # ------------------------------------------------------------------
  audit:
    name: Cargo audit
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit
        run: cargo audit

  # ------------------------------------------------------------------
  # Dependency licence policy + generated attribution inventory.
  # ------------------------------------------------------------------
  licenses:
    name: License check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      # `deny.toml` MUST keep this exact name: cargo-deny does not read
      # `Cargo.deny.toml`, and silently falls back to a default policy that
      # rejects every licence (including MIT).
      # `licenses` is the policy gate; `bans` and `sources` are cheap and
      # deterministic. Advisories are owned by the `cargo audit` job above
      # so a new entry in the advisory database cannot turn this job red
      # without a code change.
      - name: Deny
        run: cargo deny check licenses bans sources

      - name: THIRD_PARTY_LICENSES.md is up to date
        run: ./scripts/gen-third-party-licenses.sh --check
