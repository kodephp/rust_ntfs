<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ntfs-mac</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>🖥️ ntfs-mac</h1>
        <div class="status-bar">
            <span id="platform-info"></span>
            <button id="refresh-btn" class="btn btn-small">↻ Refresh</button>
        </div>
    </header>
    
    <section id="deps-section" class="card">
        <h2>System Status</h2>
        <div id="deps-status"></div>
        <button id="install-btn" class="btn btn-warning" style="display:none">Install Missing Dependencies</button>
    </section>
    
    <section class="card">
        <h2>NTFS Volumes</h2>
        <div id="volumes-list"></div>
    </section>
    
    <section class="card sponsor-card">
        <h2>Support This Project</h2>
        <div class="sponsor-content">
            <div class="sponsor-qr">
                <img id="sponsor-qr-img" src="assets/sponsor-qr.svg" alt="Sponsor QR Code"
                     title="Click to open / replace with your QR code">
                <p class="sponsor-hint">
                    Replace <code>src/assets/sponsor-qr.svg</code> with your payment QR code
                </p>
            </div>
            <div class="sponsor-info">
                <p>If ntfs-mac saves you time, consider a donation to help keep it maintained.</p>
                <div class="sponsor-actions">
                    <button class="btn btn-small btn-secondary" id="sponsor-copy-btn">Copy QR Path</button>
                    <button class="btn btn-small btn-secondary" id="sponsor-open-btn">Reveal in Finder</button>
                </div>
            </div>
        </div>
    </section>
    
    <div id="modal-overlay" class="modal-overlay" style="display:none">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modal-title">Confirm</h3>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body" id="modal-body"></div>
            <div class="modal-footer">
                <button class="btn btn-cancel" id="modal-cancel">Cancel</button>
                <button class="btn btn-danger" id="modal-confirm">Confirm</button>
            </div>
        </div>
    </div>
    
    <div id="toast-container"></div>
    
    <script src="app.js"></script>
</body>
</html>
