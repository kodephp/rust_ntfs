<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ntfs-mac — NTFS 工具箱</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="app">
        <header class="topbar">
            <div class="brand">
                <div class="brand-title">ntfs-mac</div>
                <div class="brand-sub" id="platform-info"><span data-i18n="ui.loading">检测中…</span></div>
            </div>
            <div class="topbar-actions">
                <div class="lang-toggle" role="group" aria-label="language">
                    <button id="lang-zh" class="lang-btn" type="button">中文</button>
                    <button id="lang-en" class="lang-btn" type="button">English</button>
                </div>
                <button id="refresh-btn" class="btn btn-ghost" type="button" data-i18n="refresh">刷新</button>
            </div>
        </header>

        <section class="card" id="deps-card">
            <div class="card-head">
                <h2 data-i18n="ui.deps_title">系统状态</h2>
                <span id="deps-badge" class="badge badge-muted">…</span>
            </div>
            <div id="deps-list"></div>
            <div class="card-foot">
                <button id="install-btn" class="btn btn-warning" type="button" hidden data-i18n="install_deps">安装依赖</button>
            </div>
        </section>

        <section class="card">
            <div class="card-head">
                <h2 data-i18n="ui.volumes_title">NTFS 卷</h2>
                <span id="volumes-count" class="badge badge-muted">…</span>
            </div>
            <div id="volumes-list"></div>
        </section>

        <section class="card card-quiet">
            <div id="about-block"></div>
        </section>

        <footer class="foot" data-i18n="ui.foot_hint">关闭窗口不会退出；退出请点菜单栏图标。</footer>
    </main>

    <div id="modal-overlay" class="modal-overlay" hidden>
        <div class="modal" role="dialog" aria-modal="true">
            <div class="modal-header">
                <h3 id="modal-title">…</h3>
                <button class="modal-close" id="modal-close" type="button" aria-label="close">&times;</button>
            </div>
            <div class="modal-body" id="modal-body"></div>
            <div class="modal-footer">
                <button class="btn btn-ghost" id="modal-cancel" type="button">取消</button>
                <button class="btn btn-danger" id="modal-confirm" type="button">确认</button>
            </div>
        </div>
    </div>

    <div id="toast-container" aria-live="polite"></div>

    <script src="app.js"></script>
</body>
</html>
