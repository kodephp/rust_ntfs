<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background -->
  <rect width="200" height="200" rx="8" fill="#ffffff"/>
  <!-- QR code frame -->
  <rect x="10" y="10" width="180" height="180" rx="4" fill="none" stroke="#333" stroke-width="2"/>
  <!-- Placeholder QR pattern (decorative grid) -->
  <g fill="#333">
    <!-- Position markers (corners) -->
    <rect x="20" y="20" width="40" height="40"/>
    <rect x="25" y="25" width="30" height="30" fill="#fff"/>
    <rect x="30" y="30" width="20" height="20"/>
    
    <rect x="140" y="20" width="40" height="40"/>
    <rect x="145" y="25" width="30" height="30" fill="#fff"/>
    <rect x="150" y="30" width="20" height="20"/>
    
    <rect x="20" y="140" width="40" height="40"/>
    <rect x="25" y="145" width="30" height="30" fill="#fff"/>
    <rect x="30" y="150" width="20" height="20"/>
    
    <!-- Center pattern (decorative) -->
    <rect x="80" y="80" width="12" height="12"/>
    <rect x="96" y="80" width="12" height="12"/>
    <rect x="112" y="80" width="12" height="12"/>
    <rect x="80" y="96" width="12" height="12"/>
    <rect x="112" y="96" width="12" height="12"/>
    <rect x="80" y="112" width="12" height="12"/>
    <rect x="96" y="112" width="12" height="12"/>
    <rect x="112" y="112" width="12" height="12"/>
    
    <!-- Random pattern blocks -->
    <rect x="70" y="25" width="8" height="8"/>
    <rect x="85" y="30" width="8" height="8"/>
    <rect x="100" y="25" width="8" height="8"/>
    <rect x="115" y="30" width="8" height="8"/>
    <rect x="70" y="45" width="8" height="8"/>
    <rect x="95" y="45" width="8" height="8"/>
    <rect x="110" y="45" width="8" height="8"/>
    <rect x="70" y="70" width="8" height="8"/>
    <rect x="85" y="65" width="8" height="8"/>
    <rect x="115" y="70" width="8" height="8"/>
    <rect x="70" y="130" width="8" height="8"/>
    <rect x="95" y="130" width="8" height="8"/>
    <rect x="110" y="130" width="8" height="8"/>
    <rect x="70" y="150" width="8" height="8"/>
    <rect x="85" y="145" width="8" height="8"/>
    <rect x="100" y="150" width="8" height="8"/>
    <rect x="115" y="145" width="8" height="8"/>
    <rect x="130" y="150" width="8" height="8"/>
    <rect x="145" y="130" width="8" height="8"/>
    <rect x="160" y="130" width="8" height="8"/>
    <rect x="130" y="70" width="8" height="8"/>
    <rect x="145" y="70" width="8" height="8"/>
    <rect x="160" y="70" width="8" height="8"/>
  </g>
  <!-- Overlay label -->
  <rect x="50" y="88" width="100" height="24" rx="4" fill="rgba(0,0,0,0.75)"/>
  <text x="100" y="105" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#ffd700">REPLACE ME</text>
  <text x="100" y="170" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#999">sponsor-qr.png</text>
</svg>
